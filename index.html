<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SUPA_URL='https://durugcxsakdbgimgkyiw.supabase.co';

const db=supabase.createClient(SUPA_URL,SUPA_KEY);

// Cloud CRUD helpers — all return {data, error}
async function cloudUpsertProposal(p){
  return db.from('propkit_proposals').upsert({id:p.id,user_id:(await db.auth.getUser()).data.user?.id,title:p.title,data:p},{onConflict:'id'});
}
async function cloudUpsertInvoice(inv){
  return db.from('propkit_invoices').upsert({id:inv.id,user_id:(await db.auth.getUser()).data.user?.id,title:inv.title,data:inv},{onConflict:'id'});
}
async function cloudUpsertProfile(s,userId){
  return db.from('propkit_profiles').upsert({id:userId,business_name:s.businessName||'',logo_url:s.logo||'',tagline:s.tagline||'',contact:{email:s.email||'',phone:s.phone||'',website:s.website||'',address:s.address||''},brand_color:s.accentColor||'#F5A623'},{onConflict:'id'});
}
async function cloudDeleteProposal(id){return db.from('propkit_proposals').delete().eq('id',id);}
async function cloudDeleteInvoice(id){return db.from('propkit_invoices').delete().eq('id',id);}
async function cloudFetchAll(){
  const [pr,inv,prof]=await Promise.all([
    db.from('propkit_proposals').select('data').order('created_at'),
    db.from('propkit_invoices').select('data').order('created_at'),
    db.from('propkit_profiles').select('*').maybeSingle(),
  ]);
  return {proposals:(pr.data||[]).map(r=>r.data),invoices:(inv.data||[]).map(r=>r.data),profile:prof.data};
}
// Map a cloud profile row back to the settings shape
function profileToSettings(row){
  if(!row)return null;
  return {businessName:row.business_name||'',logo:row.logo_url||'',tagline:row.tagline||'',email:row.contact?.email||'',phone:row.contact?.phone||'',website:row.contact?.website||'',address:row.contact?.address||'',accentColor:row.brand_color||'#F5A623'};
}


// ── STORAGE ──────────────────────────────────────────────────────────────────
const STORE_KEY='propkit_v2';
const OLD_KEY='propkit_v1';
const DEFAULT_PROFILE={businessName:'',tagline:'',logo:'',email:'',phone:'',website:'',address:'',accentColor:'#F5A623'};
const DEFAULT_SETTINGS={...DEFAULT_PROFILE,currency:'USD'};

function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw)return migrate(JSON.parse(raw));
    const old=localStorage.getItem(OLD_KEY);
    if(old)return migrate(migrateV1(JSON.parse(old)));
  }catch(e){}
  return null;
}
function saveStore(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmt(a,c='USD'){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(a||0);}catch(e){return (a||0).toFixed(2);}}

// ── PRICING MATH (aggregates across all pricing sections) ─────────────────────
function lineAmount(l){return (parseFloat(l.qty)||0)*(parseFloat(l.rate)||0);}
function calcPricingSection(sec){
  const lines=(sec.lines||[]).filter(l=>l.optional?l.selected:true);
  const oneTime=lines.filter(l=>(l.billing||'once')==='once').reduce((s,l)=>s+lineAmount(l),0);
  const recurring=lines.filter(l=>(l.billing||'once')==='recurring').reduce((s,l)=>s+lineAmount(l),0);
  const sub=oneTime+recurring;
  const disc=sec.discountType==='pct'?sub*(parseFloat(sec.discountVal)||0)/100:(parseFloat(sec.discountVal)||0);
  const afterDisc=Math.max(0,sub-disc);
  const tax=afterDisc*(parseFloat(sec.taxPct)||0)/100;
  return {oneTime,recurring,sub,disc,tax,total:afterDisc+tax};
}
function calcDoc(sections){
  // Aggregate one-time, recurring, tax and discount across every pricing table.
  let gOneTime=0,gRecurringMonthly=0,gTax=0,gDisc=0;
  (sections||[]).filter(s=>s.type==='pricing').forEach(s=>{
    const r=calcPricingSection(s);
    gTax+=r.tax;gDisc+=r.disc;
    const recShare=r.sub>0?r.recurring/r.sub:0;
    const discRec=r.disc*recShare;
    gOneTime+=Math.max(0,r.oneTime-(r.disc-discRec));
    gRecurringMonthly+=Math.max(0,r.recurring-discRec);
  });
  const grand=gOneTime+gTax+gRecurringMonthly;
  return {oneTime:gOneTime,recurring:gRecurringMonthly,tax:gTax,disc:gDisc,total:gOneTime+gTax,recurringTotal:gRecurringMonthly,hasRecurring:gRecurringMonthly>0,grand};
}

// ── MIGRATION ─────────────────────────────────────────────────────────────────
function migrateV1(v1){
  const profile={...DEFAULT_SETTINGS,...(v1.settings||{}),businessName:(v1.settings&&v1.settings.businessName&&v1.settings.businessName!=='Your Studio')?v1.settings.businessName:''};
  const proposals=(v1.proposals||[]).map(p=>proposalFromFlat(p));
  return {proposals,invoices:v1.invoices||[],settings:profile};
}
function proposalFromFlat(p){
  const sections=[];
  if(p.intro)sections.push(mkSection('richtext',{title:'Introduction',body:p.intro}));
  if(p.scope)sections.push(mkSection('richtext',{title:'Scope of Work',body:p.scope}));
  if(p.deliverables&&p.deliverables.length)sections.push(mkSection('list',{title:'Deliverables',items:p.deliverables.filter(Boolean)}));
  if(p.items&&p.items.length)sections.push(mkSection('pricing',{title:'Investment',taxPct:p.taxPct||0,lines:p.items.map(i=>({id:uid(),description:i.description,qty:i.qty,rate:i.rate,billing:'once',optional:false,selected:true}))}));
  if(p.notes)sections.push(mkSection('richtext',{title:'Notes & Terms',body:p.notes}));
  return {id:p.id,title:p.title,clientName:p.clientName,status:p.status||'draft',date:p.date,sections};
}
function migrate(s){
  if(!s)return s;
  s.settings={...DEFAULT_SETTINGS,...(s.settings||{})};
  if(s.settings.businessName==='Your Studio')s.settings.businessName='';
  s.proposals=(s.proposals||[]).map(p=>p.sections?p:proposalFromFlat(p));
  s.invoices=s.invoices||[];
  return s;
}

// ── SECTION FACTORY ─────────────────────────────────────────────────────────
function mkSection(type,extra={}){
  const base={id:uid(),type,collapsed:false};
  const d={
    richtext:{title:'Section',body:''},
    list:{title:'Deliverables',items:['']},
    scope:{title:'Scope of Work',phases:[{id:uid(),name:'Phase 1',summary:'',deliverables:['']}]},
    timeline:{title:'Timeline & Milestones',milestones:[{id:uid(),name:'Kickoff',date:'',detail:''}]},
    team:{title:'Our Team',members:[{id:uid(),name:'',role:'',bio:''}]},
    casestudies:{title:'Case Studies',cases:[{id:uid(),client:'',result:'',body:''}]},
    pricing:{title:'Investment',taxPct:0,discountType:'pct',discountVal:0,recurringPeriod:'month',lines:[{id:uid(),description:'',qty:1,rate:0,billing:'once',optional:false,selected:true}]},
    terms:{title:'Terms & Conditions',body:''},
    signature:{title:'Acceptance',clientLabel:'Client signature',byLabel:'Authorized by',note:'By signing below, both parties agree to the scope, timeline, and pricing set out in this proposal.'},
  };
  return {...base,...(d[type]||d.richtext),...extra};
}

// ── ROUTING ──────────────────────────────────────────────────────────────────
function getRoute(){
  const h=window.location.hash||'#/dashboard';const path=h.slice(1);
  if(path.startsWith('/proposal/'))return{view:'proposal',id:path.split('/')[2]};
  if(path.startsWith('/invoice/'))return{view:'invoice',id:path.split('/')[2]};
  if(path.startsWith('/settings'))return{view:'settings'};
  if(path.startsWith('/view/'))return{view:'client',data:path.slice(6)};
  return{view:'dashboard'};
}

const I={

// ── LOGOMARK ──────────────────────────────────────────────────────────────────
function LogoMark({size=32,light=false}){
  const c=light?'#FFFFFF':'#0F1B2D';
  return(<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width={size} height={size} fill="none" aria-hidden="true">
    <path d="M8 6 C8 4.895 8.895 4 10 4 L32 4 L44 16 L44 42 C44 43.105 43.105 44 42 44 L10 44 C8.895 44 8 43.105 8 42 Z" stroke={c} strokeWidth="2.5" strokeLinejoin="round" fill="none"/>
    <path d="M32 4 L32 16 L44 16 Z" fill="#F5A623" opacity={light?"0.35":"0.18"}/>
    {size>=32&&<><line x1="15" y1="22" x2="37" y2="22" stroke={c} strokeWidth="2" strokeLinecap="round"/><line x1="15" y1="29" x2="37" y2="29" stroke={c} strokeWidth="2" strokeLinecap="round"/><line x1="15" y1="36" x2="28" y2="36" stroke="#F5A623" strokeWidth="2" strokeLinecap="round"/></>}
  </svg>);
}
function StatusBadge({status}){
  const map={draft:'DRAFT',sent:'SENT',accepted:'ACCEPTED',declined:'DECLINED',paid:'PAID',unpaid:'UNPAID'};
  const s=status||'draft';
  return <span className={'status-'+s} role="status">{map[s]||'DRAFT'}</span>;
}

// ── BRAND HEADER (used in doc + sidebar) ──────────────────────────────────────
function BrandMark({profile,light=false,size=40}){
  const name=profile.businessName||'';
  const initials=(name||'PK').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  if(profile.logo)return <img src={profile.logo} alt={name+' logo'} style={{height:size,width:'auto',maxWidth:size*3,objectFit:'contain',borderRadius:6}}/>;
  return <div style={{width:size,height:size,borderRadius:'50%',background:light?'rgba(255,255,255,0.15)':'#0F1B2D',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:600,fontSize:size*0.35,flexShrink:0}}>{initials}</div>;
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({store,onUpdate,authUser}){
  const {proposals,invoices,settings}=store;
  const currency=settings.currency||'USD';
  const [picker,setPicker]=useState(false);
  const pipeline=proposals.filter(p=>p.status!=='declined').reduce((s,p)=>s+calcDoc(p.sections).total,0);
  const accepted=proposals.filter(p=>p.status==='accepted').length;
  const pending=proposals.filter(p=>p.status==='sent').length;
  const unpaid=invoices.filter(i=>i.status==='unpaid').length;

  function create(key){
    const p=TEMPLATES[key]();onUpdate({...store,proposals:[...proposals,p]});setPicker(false);navigate('/proposal/'+p.id);
  }
  function del(id){if(confirm('Delete this proposal?'))onUpdate({...store,proposals:proposals.filter(p=>p.id!==id)},{deletedProposalId:id});}
  function delInv(id){if(confirm('Delete this invoice?'))onUpdate({...store,invoices:invoices.filter(i=>i.id!==id)},{deletedInvoiceId:id});}

  return(<main className="dash-main" aria-label="Dashboard">
    <div style={{maxWidth:980,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,gap:12}}>
        <h1 style={{fontSize:'clamp(20px,5vw,28px)',fontWeight:600,margin:0}}>Dashboard</h1>
        <button className="btn-accent" onClick={()=>setPicker(true)} style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}><I.plus/> New Proposal</button>
      </div>
      <ProfileBanner settings={settings}/>
      <div className="stats-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:16,marginBottom:32}}>
        {[{l:'Pipeline',v:fmt(pipeline,currency),s:'one-time value'},{l:'Proposals',v:proposals.length,s:accepted+' accepted · '+pending+' pending'},{l:'Unpaid',v:unpaid,s:'invoice'+(unpaid!==1?'s':'')},{l:'Accepted',v:accepted,s:'proposal'+(accepted!==1?'s':'')}].map(s=>(
          <div key={s.l} className="card" style={{padding:'20px 24px'}}>
            <div style={{fontSize:12,fontWeight:600,color:'#566370',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:6}}>{s.l}</div>
            <div style={{fontSize:26,fontWeight:700,letterSpacing:'-0.02em',fontFamily:"'JetBrains Mono',monospace"}}>{s.v}</div>
            <div style={{fontSize:12,color:'#7C8A96',marginTop:4}}>{s.s}</div>
          </div>))}
      </div>
      <section style={{marginBottom:32}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h2 style={{fontSize:18,fontWeight:600,margin:0}}>Proposals</h2>
          <button className="btn-secondary" onClick={()=>setPicker(true)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> New</button>
        </div>
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          {proposals.length===0?(
            <div style={{textAlign:'center',padding:'48px 24px',color:'#566370'}}>
              <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>📄</div>
              <div style={{fontSize:18,fontWeight:600,color:'#0F1B2D',marginBottom:6}}>No proposals yet</div>
              <div style={{fontSize:14,marginBottom:20}}>Pick a template and you'll be writing in seconds.</div>
              <button className="btn-accent" onClick={()=>setPicker(true)}>New Proposal</button>
            </div>
          ):(<div className="table-scroll"><table style={{width:'100%',borderCollapse:'collapse',minWidth:480}}>
            <thead><tr style={{background:'#FAFBFC',borderBottom:'1px solid #E8ECF0'}}>{['Client','Title','Amount','Status',''].map(h=><th key={h} style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:'#566370',letterSpacing:'0.06em',textTransform:'uppercase',textAlign:h===''||h==='Amount'?'right':'left',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
            <tbody>{proposals.map((p,i)=>{const t=calcDoc(p.sections);return(
              <tr key={p.id} onClick={()=>navigate('/proposal/'+p.id)} onKeyDown={e=>{if(e.key==='Enter')navigate('/proposal/'+p.id);}} tabIndex={0} style={{borderBottom:'1px solid #E8ECF0',background:i%2?'#FAFBFC':'#fff',cursor:'pointer'}}>
                <td style={{padding:'12px 16px',fontSize:14,fontWeight:500,whiteSpace:'nowrap'}}>{p.clientName||<span style={{color:'#A9B4BF'}}>No client</span>}</td>
                <td style={{padding:'12px 16px',fontSize:14,color:'#3D4E5A'}}>{p.title}</td>
                <td style={{padding:'12px 16px',fontSize:14,fontFamily:"'JetBrains Mono',monospace",textAlign:'right',whiteSpace:'nowrap'}}>{fmt(t.total,currency)}{t.hasRecurring&&<span style={{color:'#7C8A96'}}> +rec</span>}</td>
                <td style={{padding:'12px 16px',whiteSpace:'nowrap'}}><StatusBadge status={p.status}/></td>
                <td style={{padding:'12px 16px',textAlign:'right'}}><button className="btn-ghost" onClick={e=>{e.stopPropagation();del(p.id);}} aria-label="Delete" style={{padding:6,color:'#991B1B',minHeight:36,minWidth:36}}><I.trash/></button></td>
              </tr>);})}</tbody></table></div>)}
        </div>
      </section>
      <section>
        <h2 style={{fontSize:18,fontWeight:600,margin:'0 0 16px'}}>Invoices</h2>
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          {invoices.length===0?(<div style={{textAlign:'center',padding:'48px 24px'}}><div style={{fontSize:40,marginBottom:12,opacity:0.3}}>🧾</div><div style={{fontSize:18,fontWeight:600,marginBottom:6}}>No invoices yet</div><div style={{fontSize:14,color:'#566370'}}>Generate one from an accepted proposal.</div></div>):(
          <div className="table-scroll"><table style={{width:'100%',borderCollapse:'collapse',minWidth:520}}>
            <thead><tr style={{background:'#FAFBFC',borderBottom:'1px solid #E8ECF0'}}>{['Client','Title','Amount','Due','Status',''].map(h=><th key={h} style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:'#566370',letterSpacing:'0.06em',textTransform:'uppercase',textAlign:h===''||h==='Amount'?'right':'left',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
            <tbody>{invoices.map((inv,i)=>{const t=calcDoc(inv.sections);return(
              <tr key={inv.id} onClick={()=>navigate('/invoice/'+inv.id)} tabIndex={0} style={{borderBottom:'1px solid #E8ECF0',background:i%2?'#FAFBFC':'#fff',cursor:'pointer'}}>
                <td style={{padding:'12px 16px',fontSize:14,fontWeight:500,whiteSpace:'nowrap'}}>{inv.clientName||'—'}</td>
                <td style={{padding:'12px 16px',fontSize:14,color:'#3D4E5A'}}>{inv.title}</td>
                <td style={{padding:'12px 16px',fontSize:14,fontFamily:"'JetBrains Mono',monospace",textAlign:'right',whiteSpace:'nowrap'}}>{fmt(t.total,currency)}</td>
                <td style={{padding:'12px 16px',fontSize:13,color:'#566370',whiteSpace:'nowrap'}}>{inv.dueDate||'—'}</td>
                <td style={{padding:'12px 16px',whiteSpace:'nowrap'}}><StatusBadge status={inv.status}/></td>
                <td style={{padding:'12px 16px',textAlign:'right'}}><button className="btn-ghost" onClick={e=>{e.stopPropagation();delInv(inv.id);}} aria-label="Delete" style={{padding:6,color:'#991B1B',minHeight:36,minWidth:36}}><I.trash/></button></td>
              </tr>);})}</tbody></table></div>)}
        </div>
      </section>
    </div>
    {picker&&<TemplatePicker onPick={create} onClose={()=>setPicker(false)}/>}
  </main>);
}

function TemplatePicker({onPick,onClose}){
  return(<div className="no-print" onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,27,45,0.45)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
    <div onClick={e=>e.stopPropagation()} className="card" style={{maxWidth:560,width:'100%',padding:24,maxHeight:'90vh',overflowY:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><h2 style={{fontSize:20,fontWeight:600,margin:0}}>Choose a starting point</h2><button className="btn-ghost" onClick={onClose} aria-label="Close" style={{fontSize:20,padding:'4px 10px'}}>×</button></div>
      <p style={{fontSize:14,color:'#566370',marginTop:0,marginBottom:18}}>Pick the closest match — you can add, remove, or reorder any section later.</p>
      <div style={{display:'grid',gap:10}}>
        {TEMPLATE_META.map(t=>(<button key={t.key} className="menu-item" onClick={()=>onPick(t.key)} style={{border:'1px solid #E8ECF0',alignItems:'center'}}>
          <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15}}>{t.name}</div><div style={{fontSize:13,color:'#566370'}}>{t.desc}</div></div>
          <I.chevR/>
        </button>))}
      </div>
    </div>
  </div>);
}

// ── ADD-SECTION MENU ──────────────────────────────────────────────────────────
function AddSectionMenu({onAdd,label='Add section'}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  return(<div ref={ref} style={{position:'relative',display:'inline-block'}}>
    <button className="btn-accent" onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:6}}><I.plus/> {label}</button>
    {open&&<div className="menu-pop" role="menu">
      <div style={{fontSize:11,fontWeight:600,color:'#7C8A96',textTransform:'uppercase',letterSpacing:'0.05em',padding:'4px 10px 8px'}}>Pick a section type</div>
      {SECTION_TYPES.map(t=>(<button key={t.type} className="menu-item" role="menuitem" onClick={()=>{onAdd(t.type);setOpen(false);}}>
        <div><div style={{fontWeight:600,fontSize:14}}>{t.label}</div><div style={{fontSize:12,color:'#566370',lineHeight:1.4}}>{t.desc}</div></div>
      </button>))}
    </div>}
  </div>);
}

// ── SECTION EDITORS ─────────────────────────────────────────────────────────
function arr(setSec,key){return {
  add:(v)=>setSec(s=>({...s,[key]:[...(s[key]||[]),v]})),
  upd:(idx,v)=>setSec(s=>({...s,[key]:s[key].map((x,i)=>i===idx?v:x)})),
  del:(idx)=>setSec(s=>({...s,[key]:s[key].filter((_,i)=>i!==idx)})),
};}

function SectionEditor({sec,setSec,currency}){
  const set=(k,v)=>setSec(s=>({...s,[k]:v}));
  if(sec.type==='richtext'||sec.type==='terms')return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Executive Summary"/></div>
    <div><label>Body</label><textarea value={sec.body} onChange={e=>set('body',e.target.value)} placeholder="Write here… Press Enter for new paragraphs." style={{minHeight:140}}/></div>
  </>);
  if(sec.type==='list'){const a=arr(setSec,'items');return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    <label>Items</label>
    {(sec.items||[]).map((it,i)=>(<div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
      <input value={it} onChange={e=>a.upd(i,e.target.value)} placeholder={'Item '+(i+1)}/>
      <button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove" style={{padding:8,color:'#991B1B',flexShrink:0}}><I.trash/></button>
    </div>))}
    <button className="btn-secondary" onClick={()=>a.add('')} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> Add item</button>
  </>);}
  if(sec.type==='scope'){const a=arr(setSec,'phases');return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    {(sec.phases||[]).map((ph,i)=>(<div key={ph.id} style={{border:'1px solid #E8ECF0',borderRadius:10,padding:14,marginBottom:12,background:'#FAFBFC'}}>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <input value={ph.name} onChange={e=>a.upd(i,{...ph,name:e.target.value})} placeholder={'Phase '+(i+1)+' name'} style={{fontWeight:600}}/>
        <button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove phase" style={{padding:8,color:'#991B1B',flexShrink:0}}><I.trash/></button>
      </div>
      <textarea value={ph.summary} onChange={e=>a.upd(i,{...ph,summary:e.target.value})} placeholder="What happens in this phase…" style={{minHeight:60,marginBottom:10}}/>
      <label style={{fontSize:11}}>Deliverables in this phase</label>
      {(ph.deliverables||[]).map((d,j)=>(<div key={j} style={{display:'flex',gap:8,marginBottom:6}}>
        <input value={d} onChange={e=>a.upd(i,{...ph,deliverables:ph.deliverables.map((x,k)=>k===j?e.target.value:x)})} placeholder={'Deliverable '+(j+1)}/>
        <button className="btn-ghost" onClick={()=>a.upd(i,{...ph,deliverables:ph.deliverables.filter((_,k)=>k!==j)})} aria-label="Remove" style={{padding:8,color:'#991B1B',flexShrink:0}}><I.trash/></button>
      </div>))}
      <button className="btn-ghost" onClick={()=>a.upd(i,{...ph,deliverables:[...(ph.deliverables||[]),'']})} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,padding:'4px 8px'}}><I.plus/> Add deliverable</button>
    </div>))}
    <button className="btn-secondary" onClick={()=>a.add({id:uid(),name:'Phase '+((sec.phases||[]).length+1),summary:'',deliverables:['']})} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> Add phase</button>
  </>);}
  if(sec.type==='timeline'){const a=arr(setSec,'milestones');return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    {(sec.milestones||[]).map((m,i)=>(<div key={m.id} style={{display:'grid',gridTemplateColumns:'1fr 150px auto',gap:8,marginBottom:8,alignItems:'start'}}>
      <input value={m.name} onChange={e=>a.upd(i,{...m,name:e.target.value})} placeholder="Milestone"/>
      <input type="date" value={m.date} onChange={e=>a.upd(i,{...m,date:e.target.value})}/>
      <button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove" style={{padding:8,color:'#991B1B'}}><I.trash/></button>
      <input value={m.detail} onChange={e=>a.upd(i,{...m,detail:e.target.value})} placeholder="Detail (optional)" style={{gridColumn:'1/-1'}}/>
    </div>))}
    <button className="btn-secondary" onClick={()=>a.add({id:uid(),name:'',date:'',detail:''})} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> Add milestone</button>
  </>);}
  if(sec.type==='team'){const a=arr(setSec,'members');return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    {(sec.members||[]).map((m,i)=>(<div key={m.id} style={{border:'1px solid #E8ECF0',borderRadius:10,padding:14,marginBottom:12,background:'#FAFBFC'}}>
      <div className="form-grid-2" style={{marginBottom:10}}>
        <input value={m.name} onChange={e=>a.upd(i,{...m,name:e.target.value})} placeholder="Name"/>
        <input value={m.role} onChange={e=>a.upd(i,{...m,role:e.target.value})} placeholder="Role / title"/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <textarea value={m.bio} onChange={e=>a.upd(i,{...m,bio:e.target.value})} placeholder="Short bio…" style={{minHeight:60}}/>
        <button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove" style={{padding:8,color:'#991B1B',flexShrink:0,alignSelf:'flex-start'}}><I.trash/></button>
      </div>
    </div>))}
    <button className="btn-secondary" onClick={()=>a.add({id:uid(),name:'',role:'',bio:''})} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> Add team member</button>
  </>);}
  if(sec.type==='casestudies'){const a=arr(setSec,'cases');return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    {(sec.cases||[]).map((c,i)=>(<div key={c.id} style={{border:'1px solid #E8ECF0',borderRadius:10,padding:14,marginBottom:12,background:'#FAFBFC'}}>
      <div className="form-grid-2" style={{marginBottom:10}}>
        <input value={c.client} onChange={e=>a.upd(i,{...c,client:e.target.value})} placeholder="Client / project"/>
        <input value={c.result} onChange={e=>a.upd(i,{...c,result:e.target.value})} placeholder="Headline result (e.g. +40% sales)"/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <textarea value={c.body} onChange={e=>a.upd(i,{...c,body:e.target.value})} placeholder="What you did and the outcome…" style={{minHeight:60}}/>
        <button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove" style={{padding:8,color:'#991B1B',flexShrink:0,alignSelf:'flex-start'}}><I.trash/></button>
      </div>
    </div>))}
    <button className="btn-secondary" onClick={()=>a.add({id:uid(),client:'',result:'',body:''})} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}><I.plus/> Add case study</button>
  </>);}
  if(sec.type==='signature')return(<>
    <div style={{marginBottom:14}}><label>Heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)}/></div>
    <div style={{marginBottom:14}}><label>Note above signatures</label><textarea value={sec.note} onChange={e=>set('note',e.target.value)} style={{minHeight:60}}/></div>
    <div className="form-grid-2">
      <div><label>Left label</label><input value={sec.clientLabel} onChange={e=>set('clientLabel',e.target.value)}/></div>
      <div><label>Right label</label><input value={sec.byLabel} onChange={e=>set('byLabel',e.target.value)}/></div>
    </div>
  </>);
  if(sec.type==='pricing')return <PricingEditor sec={sec} setSec={setSec} currency={currency} set={set}/>;
  return null;
}

function PricingEditor({sec,setSec,currency,set}){
  const a=arr(setSec,'lines');
  const r=calcPricingSection(sec);
  const [adv,setAdv]=useState((parseFloat(sec.discountVal)||0)>0||(parseFloat(sec.taxPct)||0)>0);
  return(<>
    <div style={{marginBottom:14}}><label>Table heading</label><input value={sec.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Professional Services"/></div>
    <div className="table-scroll"><table style={{width:'100%',borderCollapse:'collapse',marginBottom:12,minWidth:560}}>
      <thead><tr style={{borderBottom:'1.5px solid #0F1B2D'}}>{['Description','Qty','Rate','Billing','Add-on','Amount',''].map(h=><th key={h} style={{padding:'6px 6px',fontSize:11,fontWeight:600,color:'#566370',textAlign:h==='Amount'||h===''?'right':'left',textTransform:'uppercase',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
      <tbody>{(sec.lines||[]).map((l,i)=>(<tr key={l.id} style={{borderBottom:'1px solid #E8ECF0',opacity:(l.optional&&!l.selected)?0.55:1}}>
        <td style={{padding:6}}><input value={l.description} onChange={e=>a.upd(i,{...l,description:e.target.value})} placeholder="Description" style={{fontSize:13,minWidth:130}}/></td>
        <td style={{padding:6,width:64}}><input type="number" min="0" value={l.qty} onChange={e=>a.upd(i,{...l,qty:e.target.value})} style={{fontSize:13,textAlign:'right',padding:'8px'}} aria-label="Qty"/></td>
        <td style={{padding:6,width:100}}><input type="number" min="0" value={l.rate} onChange={e=>a.upd(i,{...l,rate:e.target.value})} style={{fontSize:13,textAlign:'right',padding:'8px'}} aria-label="Rate"/></td>
        <td style={{padding:6,width:120}}><select value={l.billing||'once'} onChange={e=>a.upd(i,{...l,billing:e.target.value})} style={{fontSize:13,padding:'8px'}} aria-label="Billing"><option value="once">One-time</option><option value="recurring">Recurring</option></select></td>
        <td style={{padding:6,textAlign:'center',width:64}}><input type="checkbox" checked={!!l.optional} onChange={e=>a.upd(i,{...l,optional:e.target.checked,selected:e.target.checked?(l.selected!==false):true})} style={{width:'auto'}} aria-label="Optional add-on"/></td>
        <td style={{padding:6,width:100,textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:500,whiteSpace:'nowrap'}}>{fmt(lineAmount(l),currency)}</td>
        <td style={{padding:6,width:40,textAlign:'right'}}><button className="btn-ghost" onClick={()=>a.del(i)} aria-label="Remove line" style={{padding:4,color:'#991B1B',minHeight:32,minWidth:32}}><I.trash/></button></td>
      </tr>))}</tbody>
    </table></div>
    <button className="btn-secondary" onClick={()=>a.add({id:uid(),description:'',qty:1,rate:0,billing:'once',optional:false,selected:true})} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13,marginBottom:14}}><I.plus/> Add line item</button>
    <div style={{fontSize:12,color:'#7C8A96',marginBottom:14}}>Tip: tick “Add-on” to make a line an optional extra. Set Billing to “Recurring” for monthly retainers — recurring totals are tracked separately.</div>
    {!adv?(<button className="btn-ghost" onClick={()=>setAdv(true)} style={{fontSize:13,padding:'6px 10px',color:'#1547A8'}}>+ Add discount or tax</button>):(
      <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'flex-end',padding:14,background:'#FAFBFC',borderRadius:10,border:'1px solid #E8ECF0'}}>
        <div style={{width:140}}><label>Discount</label><div style={{display:'flex',gap:6}}>
          <input type="number" min="0" value={sec.discountVal} onChange={e=>set('discountVal',e.target.value)} style={{textAlign:'right'}}/>
          <select value={sec.discountType} onChange={e=>set('discountType',e.target.value)} style={{width:64}}><option value="pct">%</option><option value="flat">{currency}</option></select>
        </div></div>
        <div style={{width:90}}><label>Tax %</label><input type="number" min="0" value={sec.taxPct} onChange={e=>set('taxPct',e.target.value)} style={{textAlign:'right'}}/></div>
      </div>)}
    <div style={{marginTop:16,padding:'12px 16px',background:'#0F1B2D',color:'#fff',borderRadius:8,display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
      <span style={{fontWeight:600}}>This table</span>
      <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:500}}>{fmt(r.total,currency)}{r.recurring>0&&' incl. '+fmt(r.recurring,currency)+'/'+(sec.recurringPeriod||'mo')}</span>
    </div>
  </>);
}

// ── PROPOSAL BUILDER ──────────────────────────────────────────────────────────
function ProposalBuilder({id,store,onUpdate}){
  const existing=store.proposals.find(p=>p.id===id);
  const [p,setP]=useState(existing||TEMPLATES.blank());
  const [saved,setSaved]=useState(false);
  const [copied,setCopied]=useState(false);
  const [tab,setTab]=useState('edit');
  const currency=store.settings.currency||'USD';
  const totals=calcDoc(p.sections);

  useEffect(()=>{const t=setTimeout(()=>save(p),600);return()=>clearTimeout(t);},[p]);// autosave
  function save(next=p){
    const proposals=store.proposals.find(x=>x.id===id)?store.proposals.map(x=>x.id===id?next:x):[...store.proposals,next];
    onUpdate({...store,proposals});setSaved(true);setTimeout(()=>setSaved(false),1500);
  }
  function setMeta(k,v){setP(x=>({...x,[k]:v}));}
  function addSection(type){setP(x=>({...x,sections:[...x.sections,mkSection(type)]}));}
  function setSection(sid,updater){setP(x=>({...x,sections:x.sections.map(s=>s.id===sid?(typeof updater==='function'?updater(s):updater):s)}));}
  function moveSection(idx,dir){setP(x=>{const a=[...x.sections];const j=idx+dir;if(j<0||j>=a.length)return x;[a[idx],a[j]]=[a[j],a[idx]];return{...x,sections:a};});}
  function dupSection(idx){setP(x=>{const a=[...x.sections];const c=JSON.parse(JSON.stringify(a[idx]));c.id=uid();a.splice(idx+1,0,c);return{...x,sections:a};});}
  function delSection(idx){setP(x=>({...x,sections:x.sections.filter((_,i)=>i!==idx)}));}

  function generateInvoice(){
    const inv={id:uid(),proposalId:p.id,title:'Invoice — '+p.title,clientName:p.clientName,sections:JSON.parse(JSON.stringify(p.sections.filter(s=>s.type==='pricing'))),status:'unpaid',date:new Date().toISOString().slice(0,10),dueDate:new Date(Date.now()+30*864e5).toISOString().slice(0,10),notes:'Payment due within 30 days.'};
    onUpdate({...store,proposals:store.proposals.map(x=>x.id===id?p:x),invoices:[...store.invoices,inv]});
    navigate('/invoice/'+inv.id);
  }
  function copyClientLink(){
    const payload={...p,_profile:{businessName:store.settings.businessName,tagline:store.settings.tagline,logo:store.settings.logo,email:store.settings.email,phone:store.settings.phone,website:store.settings.website,address:store.settings.address,accentColor:store.settings.accentColor,currency:store.settings.currency}};
    const data=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    const url=window.location.origin+window.location.pathname+'#/view/'+data;
    const done=()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);};
    navigator.clipboard.writeText(url).then(done).catch(()=>{const el=document.createElement('textarea');el.value=url;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();done();});
  }

  return(<main style={{flex:1,overflowY:'auto',padding:'clamp(16px,4vw,32px)'}} aria-label="Proposal builder">
    <div style={{maxWidth:1180,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <button className="btn-ghost" onClick={()=>navigate('/dashboard')} aria-label="Back" style={{padding:8,display:'flex',flexShrink:0}}><I.back/></button>
        <h1 style={{fontSize:'clamp(16px,4vw,22px)',fontWeight:600,margin:0,flex:1,minWidth:120}}>{p.title||'Untitled Proposal'}</h1>
        <div className="builder-actions">
          <button className="btn-secondary" onClick={copyClientLink} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',fontSize:13}}><I.copy/>{copied?'Copied!':'Share'}</button>
          <button className="btn-secondary" onClick={generateInvoice} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',fontSize:13}}><I.doc/>Invoice</button>
          <button className="btn-secondary" onClick={()=>window.print()} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',fontSize:13}}><I.print/>PDF</button>
          <span style={{fontSize:12,color:saved?'#1A6B3A':'#7C8A96',alignSelf:'center',display:'flex',alignItems:'center',gap:4}}>{saved?<><I.check/> Saved</>:'Auto-saves'}</span>
        </div>
      </div>
      <ProfileBanner settings={store.settings}/>
      <div style={{display:'flex',gap:0,marginBottom:24,borderBottom:'2px solid #E8ECF0'}} role="tablist">
        {['edit','preview'].map(t=>(<button key={t} role="tab" aria-selected={tab===t} onClick={()=>setTab(t)} style={{padding:'10px 20px',fontSize:14,fontWeight:600,background:'none',border:'none',cursor:'pointer',color:tab===t?'#0F1B2D':'#566370',borderBottom:tab===t?'2px solid #0F1B2D':'2px solid transparent',marginBottom:'-2px',textTransform:'capitalize'}}>{t}</button>))}
      </div>

      {tab==='edit'?(<div className="builder-grid">
        {/* Outline rail */}
        <aside className="outline-rail no-print">
          <div className="card" style={{padding:14}}>
            <div style={{fontSize:11,fontWeight:600,color:'#7C8A96',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Outline</div>
            <ol style={{listStyle:'none',margin:0,padding:0,display:'flex',flexDirection:'column',gap:2}}>
              {p.sections.map((s,i)=>(<li key={s.id}><a href={'#sec-'+s.id} onClick={e=>{e.preventDefault();const el=document.getElementById('sec-'+s.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}} style={{display:'block',fontSize:13,color:'#3D4E5A',textDecoration:'none',padding:'5px 8px',borderRadius:6,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{i+1}. {s.title||SECTION_TYPES.find(t=>t.type===s.type)?.label}</a></li>))}
            </ol>
            <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid #E8ECF0',fontSize:13}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#566370'}}>One-time</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{fmt(totals.total,currency)}</span></div>
              {totals.hasRecurring&&<div style={{display:'flex',justifyContent:'space-between',marginTop:4}}><span style={{color:'#566370'}}>Recurring</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{fmt(totals.recurring,currency)}</span></div>}
            </div>
          </div>
        </aside>

        {/* Editor column */}
        <div>
          <div className="card" style={{padding:20,marginBottom:18}}>
            <div className="form-grid-2">
              <div><label htmlFor="pt">Proposal title</label><input id="pt" value={p.title} onChange={e=>setMeta('title',e.target.value)} placeholder="e.g. Website Redesign Proposal"/></div>
              <div><label htmlFor="pc">Client name</label><input id="pc" value={p.clientName} onChange={e=>setMeta('clientName',e.target.value)} placeholder="e.g. Acme Corp"/></div>
              <div><label htmlFor="pd">Date</label><input id="pd" type="date" value={p.date} onChange={e=>setMeta('date',e.target.value)}/></div>
              <div><label htmlFor="ps">Status</label><select id="ps" value={p.status} onChange={e=>setMeta('status',e.target.value)}><option value="draft">Draft</option><option value="sent">Sent</option><option value="accepted">Accepted</option><option value="declined">Declined</option></select></div>
            </div>
          </div>

          {p.sections.map((sec,i)=>{
            const meta=SECTION_TYPES.find(t=>t.type===sec.type);
            return(<div key={sec.id} id={'sec-'+sec.id} className="sec-card">
              <div className="sec-head" onClick={()=>setSection(sec.id,s=>({...s,collapsed:!s.collapsed}))}>
                <span style={{color:'#7C8A96',transform:sec.collapsed?'rotate(0deg)':'rotate(90deg)',transition:'transform 150ms',display:'flex'}}><I.chevR/></span>
                <span style={{flex:1,fontWeight:600,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sec.title||meta?.label}<span style={{color:'#A9B4BF',fontWeight:400,marginLeft:8,fontSize:12}}>{meta?.label}</span></span>
                <div style={{display:'flex',gap:2}} onClick={e=>e.stopPropagation()}>
                  <button className="btn-ghost" onClick={()=>moveSection(i,-1)} disabled={i===0} aria-label="Move up" style={{padding:6,minHeight:32,minWidth:32,opacity:i===0?0.3:1}}><I.up/></button>
                  <button className="btn-ghost" onClick={()=>moveSection(i,1)} disabled={i===p.sections.length-1} aria-label="Move down" style={{padding:6,minHeight:32,minWidth:32,opacity:i===p.sections.length-1?0.3:1}}><I.down/></button>
                  <button className="btn-ghost" onClick={()=>dupSection(i)} aria-label="Duplicate" style={{padding:6,minHeight:32,minWidth:32}}><I.copy/></button>
                  <button className="btn-ghost" onClick={()=>{if(confirm('Remove this section?'))delSection(i);}} aria-label="Delete section" style={{padding:6,minHeight:32,minWidth:32,color:'#991B1B'}}><I.trash/></button>
                </div>
              </div>
              {!sec.collapsed&&<div className="sec-body"><SectionEditor sec={sec} setSec={updater=>setSection(sec.id,updater)} currency={currency}/></div>}
            </div>);
          })}

          <div style={{marginTop:16,display:'flex',justifyContent:'center'}}><AddSectionMenu onAdd={addSection}/></div>
        </div>
      </div>):(
        <DocPreview doc={p} profile={store.settings}/>
      )}
    </div>
  </main>);
}

// ── DOCUMENT PREVIEW (renders any section type; used for proposal + client view) ─
function H2({children}){return <h2 style={{fontFamily:'"DM Serif Display",Georgia,serif',fontSize:'clamp(22px,5vw,30px)',fontWeight:400,color:'#0F1B2D',margin:'44px 0 16px'}}>{children}</h2>;}
function Para({text}){return <>{(text||'').split(/\n{2,}/).map((para,i)=><p key={i} style={{fontSize:15,color:'#3D4E5A',lineHeight:1.7,margin:'0 0 14px',whiteSpace:'pre-wrap'}}>{para}</p>)}</>;}

function SectionView({sec,profile,currency}){
  const brand=profile.accentColor||'#F5A623';
  if((sec.type==='richtext'||sec.type==='terms')&&!sec.body&&!sec.title)return null;
  if(sec.type==='richtext'||sec.type==='terms')return(<section className="doc-section"><H2>{sec.title}</H2><Para text={sec.body}/></section>);
  if(sec.type==='list')return(<section className="doc-section"><H2>{sec.title}</H2><ul style={{listStyle:'none',padding:0,margin:0}}>{(sec.items||[]).filter(Boolean).map((d,i)=><li key={i} style={{display:'flex',gap:10,marginBottom:10,fontSize:15,color:'#3D4E5A',lineHeight:1.6}}><span style={{width:6,height:6,borderRadius:'50%',background:brand,marginTop:7,flexShrink:0}}></span>{d}</li>)}</ul></section>);
  if(sec.type==='scope')return(<section className="doc-section"><H2>{sec.title}</H2>{(sec.phases||[]).map((ph,i)=>(<div key={ph.id} style={{marginBottom:24,paddingLeft:18,borderLeft:'3px solid '+brand}}>

// ── CLIENT VIEW ──────────────────────────────────────────────────────────────
function ClientView({data}){
  let doc=null,profile={...DEFAULT_SETTINGS};
  try{
    const json=decodeURIComponent(escape(atob(decodeURIComponent(data))));
    doc=JSON.parse(json);
    if(doc._profile)profile={...profile,...doc._profile};
  }catch(e){
    try{doc=JSON.parse(atob(data));if(doc.businessName)profile.businessName=doc.businessName;}catch(e2){
      return(<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F4F6F8'}}><div style={{textAlign:'center'}}><h1 style={{fontSize:22,color:'#991B1B'}}>Invalid proposal link</h1><p style={{color:'#566370'}}>This link may be corrupted or expired.</p></div></div>);
    }
  }
  if(!doc.sections)doc=proposalFromFlat(doc);
  return <DocPreview doc={doc} profile={profile} readOnly={true}/>;
}

function Settings({store,onUpdate}){

  const fileRef=useRef(null),logoRef=useRef(null);

  function save(){onUpdate({...store,settings:s});setSaved(true);setTimeout(()=>setSaved(false),2000);}

  function exportData(){const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='propkit-workspace.json';a.click();URL.revokeObjectURL(url);}
  function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=migrate(JSON.parse(ev.target.result));if(d.proposals&&d.settings){onUpdate(d);alert('Workspace imported.');}else alert('Invalid file.');}catch{alert('Could not parse file.');}};r.readAsText(f);}

        <div style={{marginBottom:16}}>
          <label>Logo</label>
          <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
            {s.logo&&<img src={s.logo} alt="Logo preview" style={{height:48,maxWidth:160,objectFit:'contain',border:'1px solid #E8ECF0',borderRadius:8,padding:4,background:'#fff'}}/>}
            <button className="btn-secondary" onClick={()=>logoRef.current.click()} style={{display:'flex',alignItems:'center',gap:6}}><I.upload/> Upload</button>
            {s.logo&&<button className="btn-ghost" onClick={()=>set('logo','')} style={{color:'#991B1B'}}>Remove</button>}
            <input ref={logoRef} type="file" accept="image/*" onChange={onLogo} style={{display:'none'}}/>
          </div>
          <input value={s.logo&&s.logo.startsWith('data:')?'':s.logo} onChange={e=>set('logo',e.target.value)} placeholder="…or paste an image URL" style={{marginTop:8}}/>
        </div>
        <div className="form-grid-2">
          <div><label htmlFor="em">Email</label><input id="em" value={s.email} onChange={e=>set('email',e.target.value)} placeholder="hello@studio.com"/></div>
          <div><label htmlFor="ph">Phone</label><input id="ph" value={s.phone} onChange={e=>set('phone',e.target.value)} placeholder="+1 555 000 0000"/></div>
          <div><label htmlFor="wb">Website</label><input id="wb" value={s.website} onChange={e=>set('website',e.target.value)} placeholder="studio.com"/></div>

      <div className="card" style={{padding:24}}>
        <h2 style={{fontSize:16,fontWeight:600,marginTop:0,marginBottom:16}}>Workspace backup</h2>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          <button className="btn-secondary" onClick={exportData} style={{display:'flex',alignItems:'center',gap:6}}><I.download/> Export JSON</button>
          <button className="btn-secondary" onClick={()=>fileRef.current.click()} style={{display:'flex',alignItems:'center',gap:6}}><I.upload/> Import JSON</button>
        </div>
        <input ref={fileRef} type="file" accept=".json" onChange={importData} style={{display:'none'}}/>
        <p style={{fontSize:13,color:'#566370',marginTop:12,marginBottom:0}}>Everything is saved on this device. Export to back up or move to another computer.</p>
      </div>
    </div>
  </main>);
}

// ── AUTH MODAL ───────────────────────────────────────────────────────────────
function AuthModal({onClose}){
  const [step,setStep]=useState('email');// 'email' | 'code' | 'sending' | 'done'
  const [email,setEmail]=useState('');
  const [code,setCode]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);

  async function sendOtp(e){
    e.preventDefault();setErr('');setBusy(true);
    const {error}=await db.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:'https://khaledhaz.github.io/propkit/'}});
    setBusy(false);
    if(error){setErr(error.message);return;}
    setStep('code');
  }
  async function verifyCode(e){
    e.preventDefault();setErr('');setBusy(true);
    const {error}=await db.auth.verifyOtp({email:email.trim(),token:code.trim(),type:'email'});
    setBusy(false);
    if(error){setErr(error.message);return;}
    onClose();
  }
  return(
    <div role="dialog" aria-modal="true" aria-label="Sign in to sync" onClick={onClose}
      style={{position:'fixed',inset:0,background:'rgba(15,27,45,0.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div onClick={e=>e.stopPropagation()} className="card" style={{maxWidth:400,width:'100%',padding:28}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <h2 style={{fontSize:18,fontWeight:600,margin:0}}>Sign in to sync</h2>
          <button className="btn-ghost" onClick={onClose} aria-label="Close" style={{fontSize:20,padding:'4px 10px'}}>×</button>
        </div>
        <p style={{fontSize:13,color:'#566370',marginTop:0,marginBottom:20}}>
          {step==='email'?'We\'ll email you a magic link + a 6-digit code. No password needed.':'Enter the 6-digit code from your email (or click the link in it).'}
        </p>
        {step==='email'?(
          <form onSubmit={sendOtp}>
            <label htmlFor="auth-email">Email address</label>
            <input id="auth-email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required autoFocus style={{marginBottom:12}}/>
            {err&&<p role="alert" style={{color:'#991B1B',fontSize:13,margin:'0 0 10px'}}>{err}</p>}
            <button type="submit" className="btn-primary" style={{width:'100%'}} disabled={busy||!email.trim()}>{busy?'Sending…':'Send magic link'}</button>
          </form>
        ):(
          <form onSubmit={verifyCode}>
            <label htmlFor="auth-code">6-digit code</label>
            <input id="auth-code" type="text" inputMode="numeric" pattern="[0-9]{6}" maxLength={6} value={code} onChange={e=>setCode(e.target.value)} placeholder="123456" required autoFocus style={{marginBottom:12,letterSpacing:'0.25em',fontFamily:"'JetBrains Mono',monospace",fontSize:20,textAlign:'center'}}/>
            {err&&<p role="alert" style={{color:'#991B1B',fontSize:13,margin:'0 0 10px'}}>{err}</p>}
            <button type="submit" className="btn-primary" style={{width:'100%'}} disabled={busy||code.length!==6}>{busy?'Verifying…':'Verify code'}</button>
            <button type="button" className="btn-ghost" onClick={()=>{setStep('email');setCode('');setErr('');}} style={{width:'100%',marginTop:6,fontSize:13}}>Back</button>
          </form>
        )}
        <p style={{fontSize:12,color:'#A9B4BF',marginTop:16,marginBottom:0,textAlign:'center'}}>Your data stays on this device if you skip this.</p>
      </div>
    </div>
  );
}

// ── SYNC BANNER (offline notice) ──────────────────────────────────────────────
function SyncBanner({msg}){
  if(!msg)return null;
  return(
    <div role="status" aria-live="polite" className="no-print"
      style={{position:'fixed',bottom:16,left:'50%',transform:'translateX(-50%)',zIndex:300,background:'#0F1B2D',color:'#fff',borderRadius:8,padding:'10px 20px',fontSize:13,boxShadow:'0 4px 12px rgba(15,27,45,0.25)',whiteSpace:'nowrap',maxWidth:'calc(100vw - 32px)',overflow:'hidden',textOverflow:'ellipsis'}}>
      {msg}
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const [store,setStore]=useState(()=>loadStore()||{proposals:[],invoices:[],settings:{...DEFAULT_SETTINGS}});
  const [route,setRoute]=useState(getRoute);
  const [authUser,setAuthUser]=useState(null);// null = not yet resolved
  const [authReady,setAuthReady]=useState(false);
  const [showAuth,setShowAuth]=useState(false);
  const [syncMsg,setSyncMsg]=useState('');
  const syncTimer=useRef(null);

  function toast(msg,ms=3000){setSyncMsg(msg);clearTimeout(syncTimer.current);syncTimer.current=setTimeout(()=>setSyncMsg(''),ms);}

  // ── Restore session on load (handles redirect-back hash from magic link) ──
  useEffect(()=>{
    db.auth.getSession().then(({data:{session}})=>{
      setAuthUser(session?.user||null);
      setAuthReady(true);
    });
    const {data:{subscription}}=db.auth.onAuthStateChange((_event,session)=>{
      setAuthUser(session?.user||null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  // ── On sign-in: migrate local → cloud if cloud is empty, then load cloud ──
  useEffect(()=>{
    if(!authReady||!authUser)return;
    (async()=>{
      try{
        const {proposals,invoices,profile}=await cloudFetchAll();
        const hasCloudData=proposals.length>0||invoices.length>0||profile;
        if(!hasCloudData){
          // First sign-in: push local data up
          const local=loadStore()||{proposals:[],invoices:[],settings:{...DEFAULT_SETTINGS}};
          const pushOps=[
            ...local.proposals.map(p=>cloudUpsertProposal(p)),
            ...local.invoices.map(inv=>cloudUpsertInvoice(inv)),
            cloudUpsertProfile(local.settings,authUser.id),
          ];
          await Promise.all(pushOps);
          toast('Local data synced to cloud.');
        } else {
          // Load cloud data as source of truth
          const settingsFromCloud={...DEFAULT_SETTINGS,...(profileToSettings(profile)||{})};
          const merged={proposals,invoices,settings:{...store.settings,...settingsFromCloud}};
          setStore(merged);
          saveStore(merged);
          toast('Loaded from cloud.');
        }
      }catch(e){
        toast('Cloud sync error — using local data.');
      }
    })();
  },[authUser,authReady]);

  // ── Write-through: save to localStorage + cloud when signed in ──
  const updateStore=useCallback(async(next,deletedProposalId,deletedInvoiceId)=>{
    setStore(next);
    saveStore(next);
    if(!authUser)return;
    try{
      // Figure out what changed vs current store by comparing ids
      const prevStore=store;// closure over current store at call time
      const promises=[];
      if(deletedProposalId)promises.push(cloudDeleteProposal(deletedProposalId));
      if(deletedInvoiceId)promises.push(cloudDeleteInvoice(deletedInvoiceId));
      // Upsert proposals that are new or changed
      next.proposals.forEach(p=>{
        const prev=prevStore.proposals.find(x=>x.id===p.id);
        if(!prev||JSON.stringify(prev)!==JSON.stringify(p))promises.push(cloudUpsertProposal(p));
      });
      // Upsert invoices that are new or changed
      next.invoices.forEach(inv=>{
        const prev=prevStore.invoices.find(x=>x.id===inv.id);
        if(!prev||JSON.stringify(prev)!==JSON.stringify(inv))promises.push(cloudUpsertInvoice(inv));
      });
      // Upsert profile if changed
      if(JSON.stringify(next.settings)!==JSON.stringify(prevStore.settings))
        promises.push(cloudUpsertProfile(next.settings,authUser.id));
      if(promises.length)await Promise.all(promises);
    }catch(e){
      toast('Offline — saved locally.');
    }
  },[authUser,store]);

  // ── Standard localStorage-only save (keep existing autosave in builders working) ──
  useEffect(()=>{saveStore(store);},[store]);
  useEffect(()=>{document.documentElement.style.setProperty('--brand',store.settings.accentColor||'#F5A623');},[store.settings.accentColor]);
  useEffect(()=>{function onHash(){setRoute(getRoute());}window.addEventListener('hashchange',onHash);return()=>window.removeEventListener('hashchange',onHash);},[]);

  if(route.view==='client')return <ClientView data={route.data}/>;

  function onUpdate(next,opts={}){updateStore(next,opts?.deletedProposalId,opts?.deletedInvoiceId);}
  function onUpdateWithDelete(next,opts){updateStore(next,opts?.deletedProposalId,opts?.deletedInvoiceId);}

  const main=()=>{switch(route.view){
    case 'proposal':return <ProposalBuilder key={route.id} id={route.id} store={store} onUpdate={onUpdate} authUser={authUser}/>;
    case 'invoice':return <InvoiceView key={route.id} id={route.id} store={store} onUpdate={onUpdate} authUser={authUser}/>;
    case 'settings':return <Settings store={store} onUpdate={onUpdate} authUser={authUser}/>;
    default:return <Dashboard store={store} onUpdate={onUpdateWithDelete} authUser={authUser}/>;
  }};

  return(<>
    <div className="app-shell">
      <Sidebar settings={store.settings} authUser={authUser} onSignIn={()=>setShowAuth(true)} onSignOut={()=>db.auth.signOut().then(()=>toast('Signed out.'))}/>
      <div className="app-main">{main()}</div>
    </div>
    {showAuth&&<AuthModal onClose={()=>setShowAuth(false)}/>}
    <SyncBanner msg={syncMsg}/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
