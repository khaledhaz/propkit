<style>
*{box-sizing:border-box;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#F4F6F8;color:#0F1B2D;margin:0;}
:focus-visible{outline:2px solid #F5A623;outline-offset:2px;box-shadow:0 0 0 3px rgba(245,166,35,0.40);}
.btn-primary{background:#0F1B2D;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background 150ms;}
.btn-primary:hover{background:#162338;}
.btn-primary:active{background:#1D2E47;}
.btn-primary:disabled{background:#CDD4DB;color:#7C8A96;cursor:not-allowed;}
.btn-accent{background:#F5A623;color:#0F1B2D;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background 150ms;}
.btn-accent:hover{background:#D48E0F;}
.btn-secondary{background:transparent;color:#0F1B2D;border:1.5px solid #CDD4DB;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all 150ms;}
.btn-secondary:hover{background:#EEF4F8;border-color:#A8BDD4;}
.btn-ghost{background:transparent;color:#0F1B2D;border:none;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;transition:background 150ms;}
.btn-ghost:hover{background:#EEF4F8;}
.btn-danger{background:#991B1B;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-danger:hover{background:#7A1515;}
input,textarea,select{font-family:'Inter',-apple-system,sans-serif;font-size:14px;color:#0F1B2D;background:#fff;border:1.5px solid #CDD4DB;border-radius:8px;padding:10px 16px;box-shadow:0 1px 2px 0 rgba(15,27,45,0.06);width:100%;transition:border-color 150ms,box-shadow 150ms;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#F5A623;box-shadow:0 0 0 3px rgba(245,166,35,0.40);}
label{font-size:12px;font-weight:600;color:#3D4E5A;display:block;margin-bottom:6px;}
textarea{resize:vertical;min-height:96px;}
.card{background:#fff;border:1px solid #E8ECF0;border-radius:12px;box-shadow:0 1px 3px 0 rgba(15,27,45,0.10),0 1px 2px -1px rgba(15,27,45,0.06);}
.status-draft{background:#F4F6F8;color:#3D4E5A;border:1px solid #CDD4DB;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-sent{background:#DBEAFE;color:#1547A8;border:1px solid rgba(21,71,168,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-accepted{background:#D4F5E2;color:#1A6B3A;border:1px solid rgba(26,107,58,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-declined{background:#FEE2E2;color:#991B1B;border:1px solid rgba(153,27,27,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-paid{background:#D4F5E2;color:#1A6B3A;border:1px solid rgba(26,107,58,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-unpaid{background:#FEF0CC;color:#8A5A00;border:1px solid rgba(138,90,0,0.3);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
@media print{
  .no-print{display:none!important;}
  body{background:#fff;}
  .print-doc{box-shadow:none!important;border:none!important;margin:0!important;padding:40px!important;max-width:100%!important;}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo}=React;

// ── STORAGE ──────────────────────────────────────────────────────────────────
const STORE_KEY='propkit_v1';
const DEFAULT_SETTINGS={businessName:'Your Studio',currency:'USD',accentColor:'#F5A623'};

function loadStore(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw)return JSON.parse(raw);
  }catch(e){}
  return null;
}

function saveStore(data){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function fmt(amount,currency='USD'){
  return new Intl.NumberFormat('en-US',{style:'currency',currency}).format(amount||0);
}

function calcProposal(items,taxPct){
  const subtotal=items.reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.rate)||0),0);
  const tax=taxPct?subtotal*(parseFloat(taxPct)/100):0;
  return{subtotal,tax,total:subtotal+tax};
}

  id:'seed1',

  clientName:'Meridian Coffee Co.',
  intro:'Thank you for considering our studio for your brand identity project. This proposal outlines the scope, deliverables, and investment for a complete brand system that reflects your values and connects with your audience.',
  scope:'We will develop a comprehensive brand identity system including logo design, color palette, typography selection, and brand guidelines. The process involves three rounds of concepts followed by refinements based on your feedback.',
  deliverables:['Primary logo (SVG + PNG, all colour variants)','Secondary mark and icon versions','Brand color palette with hex, RGB, and CMYK values','Typography specification sheet','Brand guidelines PDF (20–30 pages)','Social media profile assets'],
  items:[
    {id:'i1',description:'Brand Strategy & Discovery',qty:1,rate:1200},
    {id:'i2',description:'Logo Design (3 concepts, 2 revisions)',qty:1,rate:2800},
    {id:'i3',description:'Brand Guidelines Document',qty:1,rate:900},
    {id:'i4',description:'Asset Production & Delivery',qty:1,rate:600},
  ],
  taxPct:10,
  status:'sent',
  date: new Date().toISOString().slice(0,10),
  notes:'Payment terms: 50% deposit due before work begins; 50% upon final delivery. Valid for 30 days.',
};

const SEED_INVOICE={
  id:'sinv1',

  title:'Invoice #001 — Brand Identity Package',
  clientName:'Meridian Coffee Co.',

  status:'unpaid',
  date:new Date().toISOString().slice(0,10),
  dueDate:new Date(Date.now()+30*864e5).toISOString().slice(0,10),
  notes:'Bank transfer or PayPal accepted. Reference: INV-001.',

function seedStore(){
  return{
    proposals:[SEED_PROPOSAL],
    invoices:[SEED_INVOICE],
    settings:DEFAULT_SETTINGS,
  };
}

// ── ROUTING ──────────────────────────────────────────────────────────────────
function getRoute(){
  const h=window.location.hash||'#/dashboard';
  const path=h.slice(1);
  if(path.startsWith('/proposal/'))return{view:'proposal',id:path.split('/')[2]};
  if(path.startsWith('/invoice/'))return{view:'invoice',id:path.split('/')[2]};
  if(path.startsWith('/settings'))return{view:'settings'};
  if(path.startsWith('/view/'))return{view:'client',data:path.slice(6)};
  return{view:'dashboard'};
}

function navigate(path){window.location.hash='#'+path;}

  plus:()=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,

// ── LOGOMARK ──────────────────────────────────────────────────────────────────
function LogoMark({size=32,light=false}){
  const c=light?'#FFFFFF':'#0F1B2D';
  const s=size/48;
  return(
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width={size} height={size} fill="none" aria-hidden="true">
      <path d="M8 6 C8 4.895 8.895 4 10 4 L32 4 L44 16 L44 42 C44 43.105 43.105 44 42 44 L10 44 C8.895 44 8 43.105 8 42 Z" stroke={c} strokeWidth="2.5" strokeLinejoin="round" fill="none"/>
      <path d="M32 4 L32 16 L44 16" stroke={c} strokeWidth="2.5" strokeLinejoin="round" fill="none"/>
      <path d="M32 4 L32 16 L44 16 Z" fill="#F5A623" opacity={light?"0.35":"0.18"}/>
      {size>=32&&<><line x1="15" y1="22" x2="37" y2="22" stroke={c} strokeWidth="2" strokeLinecap="round"/>
      <line x1="15" y1="29" x2="37" y2="29" stroke={c} strokeWidth="2" strokeLinecap="round"/>
      <line x1="15" y1="36" x2="28" y2="36" stroke="#F5A623" strokeWidth="2" strokeLinecap="round"/></>}
    </svg>
  );
}

// ── STATUS BADGE ──────────────────────────────────────────────────────────────
function StatusBadge({status}){
  const map={
    draft:{cls:'status-draft',icon:<Icon.circle/>,label:'DRAFT'},
    sent:{cls:'status-sent',icon:<Icon.send/>,label:'SENT'},
    accepted:{cls:'status-accepted',icon:<Icon.check/>,label:'ACCEPTED'},
    declined:{cls:'status-declined',icon:<Icon.x/>,label:'DECLINED'},
    paid:{cls:'status-paid',icon:<Icon.check/>,label:'PAID'},
    unpaid:{cls:'status-unpaid',icon:<Icon.circle/>,label:'UNPAID'},
  };
  const m=map[status]||map.draft;
  return <span className={m.cls} role="status">{m.icon}{m.label}</span>;
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function Sidebar({route,settings}){
  const links=[
    {path:'/dashboard',label:'Dashboard',icon:<Icon.doc/>},
    {path:'/settings',label:'Settings',icon:<Icon.settings/>},
  ];
  return(
    <nav className="no-print" style={{background:'#0F1B2D',width:220,minHeight:'100vh',padding:'0',display:'flex',flexDirection:'column',flexShrink:0}} aria-label="Main navigation">
      <div style={{padding:'24px 20px 20px',borderBottom:'1px solid rgba(255,255,255,0.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <LogoMark size={32} light={true}/>
          <span style={{fontWeight:600,fontSize:18,color:'#fff',letterSpacing:'-0.02em'}}><span style={{fontWeight:600}}>Prop</span><span style={{fontWeight:500}}>Kit</span></span>
        </div>
        {settings.businessName&&<div style={{fontSize:12,color:'rgba(255,255,255,0.45)',marginTop:6,paddingLeft:42}}>{settings.businessName}</div>}
      </div>
      <ul style={{listStyle:'none',margin:0,padding:'12px 0',flex:1}} role="list">
        {links.map(l=>{
          const active=window.location.hash.includes(l.path)||(!window.location.hash&&l.path==='/dashboard');
          return(
            <li key={l.path}>
              <a href={'#'+l.path} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 20px',color:active?'#F5A623':'rgba(255,255,255,0.7)',textDecoration:'none',fontSize:14,fontWeight:active?600:400,background:active?'rgba(245,166,35,0.08)':'transparent',borderLeft:active?'2px solid #F5A623':'2px solid transparent',transition:'all 150ms'}}
                aria-current={active?'page':undefined}>
                {l.icon}{l.label}
              </a>
            </li>
          );
        })}
      </ul>
    </nav>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({store,onUpdate}){
  const {proposals,invoices,settings}=store;
  const currency=settings.currency||'USD';
  const totalPipeline=proposals.filter(p=>p.status!=='declined').reduce((s,p)=>{
    const{total}=calcProposal(p.items||[],p.taxPct);return s+total;},0);
  const accepted=proposals.filter(p=>p.status==='accepted').length;
  const pending=proposals.filter(p=>p.status==='sent').length;
  const unpaid=invoices.filter(i=>i.status==='unpaid').length;

  function newProposal(){
    const p={id:uid(),title:'Untitled Proposal',clientName:'',intro:'',scope:'',deliverables:[],items:[{id:uid(),description:'',qty:1,rate:0}],taxPct:0,status:'draft',date:new Date().toISOString().slice(0,10),notes:''};
    const updated={...store,proposals:[...proposals,p]};
    onUpdate(updated);
    navigate('/proposal/'+p.id);
  }

  function deleteProposal(id){
    if(!confirm('Delete this proposal?'))return;
    onUpdate({...store,proposals:proposals.filter(p=>p.id!==id)});
  }
  function deleteInvoice(id){
    if(!confirm('Delete this invoice?'))return;
    onUpdate({...store,invoices:invoices.filter(i=>i.id!==id)});
  }

  return(
    <main style={{flex:1,padding:'32px',overflowY:'auto'}} aria-label="Dashboard">
      <div style={{maxWidth:960,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
          <h1 style={{fontSize:28,fontWeight:600,color:'#0F1B2D',letterSpacing:'-0.02em',margin:0}}>Dashboard</h1>
          <button className="btn-accent" onClick={newProposal} style={{display:'flex',alignItems:'center',gap:6}}>
            <Icon.plus/> New Proposal
          </button>
        </div>

        {/* Stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:16,marginBottom:32}}>
          {[
            {label:'Pipeline',value:fmt(totalPipeline,currency),sub:'total value'},
            {label:'Proposals',value:proposals.length,sub:`${accepted} accepted · ${pending} pending`},
            {label:'Unpaid',value:unpaid,sub:'invoice'+(unpaid!==1?'s':'')},
            {label:'Accepted',value:accepted,sub:'proposal'+(accepted!==1?'s':'')},
          ].map(s=>(
            <div key={s.label} className="card" style={{padding:'20px 24px'}}>
              <div style={{fontSize:12,fontWeight:600,color:'#566370',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:6}}>{s.label}</div>
              <div style={{fontSize:26,fontWeight:700,color:'#0F1B2D',letterSpacing:'-0.02em',fontFamily:"'JetBrains Mono',monospace"}}>{s.value}</div>
              <div style={{fontSize:12,color:'#7C8A96',marginTop:4}}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* Proposals */}
        <section aria-labelledby="prop-heading" style={{marginBottom:32}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <h2 id="prop-heading" style={{fontSize:18,fontWeight:600,margin:0}}>Proposals</h2>
            <button className="btn-secondary" onClick={newProposal} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13}}>
              <Icon.plus/> New
            </button>
          </div>
          <div className="card" style={{padding:0,overflow:'hidden'}}>
            {proposals.length===0?(
              <div style={{textAlign:'center',padding:'64px 24px',color:'#566370'}}>
                <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>📄</div>
                <div style={{fontSize:18,fontWeight:600,color:'#0F1B2D',marginBottom:6}}>No proposals yet</div>
                <div style={{fontSize:14,color:'#566370',marginBottom:20}}>Create your first proposal and send it to a client.</div>
                <button className="btn-accent" onClick={newProposal}>New Proposal</button>
              </div>
            ):(
              <table style={{width:'100%',borderCollapse:'collapse'}} role="table" aria-label="Proposals list">
                <thead>
                  <tr style={{background:'#FAFBFC',borderBottom:'1px solid #E8ECF0'}}>
                    {['Client','Title','Amount','Status',''].map(h=>(
                      <th key={h} scope="col" style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:'#566370',letterSpacing:'0.06em',textTransform:'uppercase',textAlign:h===''||h==='Amount'?'right':'left'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {proposals.map((p,i)=>{
                    const {total}=calcProposal(p.items||[],p.taxPct);
                    return(
                      <tr key={p.id} style={{borderBottom:'1px solid #E8ECF0',background:i%2===0?'#fff':'#FAFBFC',cursor:'pointer'}}
                        onClick={()=>navigate('/proposal/'+p.id)}
                        onKeyDown={e=>{if(e.key==='Enter'||e.key===' ')navigate('/proposal/'+p.id);}}
                        tabIndex={0} role="row" aria-label={`${p.clientName} - ${p.title}`}>
                        <td style={{padding:'14px 16px',fontSize:14,fontWeight:500,color:'#0F1B2D'}}>{p.clientName||<span style={{color:'#A9B4BF'}}>No client</span>}</td>
                        <td style={{padding:'14px 16px',fontSize:14,color:'#3D4E5A'}}>{p.title}</td>
                        <td style={{padding:'14px 16px',fontSize:14,fontFamily:"'JetBrains Mono',monospace",color:'#0F1B2D',textAlign:'right'}}>{fmt(total,currency)}</td>
                        <td style={{padding:'14px 16px'}}><StatusBadge status={p.status}/></td>
                        <td style={{padding:'14px 16px',textAlign:'right'}}>
                          <button className="btn-ghost" onClick={e=>{e.stopPropagation();deleteProposal(p.id);}} aria-label={`Delete proposal ${p.title}`} style={{padding:'6px',color:'#991B1B'}}>
                            <Icon.trash/>
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </section>

        {/* Invoices */}
        <section aria-labelledby="inv-heading">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <h2 id="inv-heading" style={{fontSize:18,fontWeight:600,margin:0}}>Invoices</h2>
          </div>
          <div className="card" style={{padding:0,overflow:'hidden'}}>
            {invoices.length===0?(
              <div style={{textAlign:'center',padding:'64px 24px'}}>
                <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>🧾</div>
                <div style={{fontSize:18,fontWeight:600,color:'#0F1B2D',marginBottom:6}}>No invoices yet</div>
                <div style={{fontSize:14,color:'#566370'}}>Generate an invoice from an accepted proposal.</div>
              </div>
            ):(
              <table style={{width:'100%',borderCollapse:'collapse'}} role="table" aria-label="Invoices list">
                <thead>
                  <tr style={{background:'#FAFBFC',borderBottom:'1px solid #E8ECF0'}}>
                    {['Client','Title','Amount','Due','Status',''].map(h=>(
                      <th key={h} scope="col" style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:'#566370',letterSpacing:'0.06em',textTransform:'uppercase',textAlign:h===''||h==='Amount'?'right':'left'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {invoices.map((inv,i)=>{
                    const {total}=calcProposal(inv.items||[],inv.taxPct);
                    return(
                      <tr key={inv.id} style={{borderBottom:'1px solid #E8ECF0',background:i%2===0?'#fff':'#FAFBFC',cursor:'pointer'}}
                        onClick={()=>navigate('/invoice/'+inv.id)}
                        onKeyDown={e=>{if(e.key==='Enter'||e.key===' ')navigate('/invoice/'+inv.id);}}
                        tabIndex={0} role="row">
                        <td style={{padding:'14px 16px',fontSize:14,fontWeight:500,color:'#0F1B2D'}}>{inv.clientName||'—'}</td>
                        <td style={{padding:'14px 16px',fontSize:14,color:'#3D4E5A'}}>{inv.title}</td>
                        <td style={{padding:'14px 16px',fontSize:14,fontFamily:"'JetBrains Mono',monospace",color:'#0F1B2D',textAlign:'right'}}>{fmt(total,currency)}</td>
                        <td style={{padding:'14px 16px',fontSize:13,color:'#566370'}}>{inv.dueDate||'—'}</td>
                        <td style={{padding:'14px 16px'}}><StatusBadge status={inv.status}/></td>
                        <td style={{padding:'14px 16px',textAlign:'right'}}>
                          <button className="btn-ghost" onClick={e=>{e.stopPropagation();deleteInvoice(inv.id);}} aria-label={`Delete invoice ${inv.title}`} style={{padding:'6px',color:'#991B1B'}}>
                            <Icon.trash/>
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </section>
      </div>
    </main>
  );
}

// ── PROPOSAL BUILDER ──────────────────────────────────────────────────────────
function ProposalBuilder({id,store,onUpdate}){
  const existing=store.proposals.find(p=>p.id===id);
  const [p,setP]=useState(existing||{id,title:'',clientName:'',intro:'',scope:'',deliverables:[],items:[{id:uid(),description:'',qty:1,rate:0}],taxPct:0,status:'draft',date:new Date().toISOString().slice(0,10),notes:''});
  const [saved,setSaved]=useState(false);
  const [copied,setCopied]=useState(false);
  const [tab,setTab]=useState('edit');
  const currency=store.settings.currency||'USD';

  function save(next=p){
    const proposals=store.proposals.find(x=>x.id===id)?store.proposals.map(x=>x.id===id?next:x):[...store.proposals,next];
    onUpdate({...store,proposals});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  }

  function loadTemplate(key){
    if(!key)return;
    const t=TEMPLATES[key];
    const next={...p,...t,id,status:p.status,date:p.date};
    setP(next);save(next);
  }

  function addItem(){setP(x=>({...x,items:[...x.items,{id:uid(),description:'',qty:1,rate:0}]}));}
  function removeItem(iid){setP(x=>({...x,items:x.items.filter(i=>i.id!==iid)}));}
  function updateItem(iid,field,val){setP(x=>({...x,items:x.items.map(i=>i.id===iid?{...i,[field]:val}:i)}));}
  function addDeliverable(){setP(x=>({...x,deliverables:[...x.deliverables,'']}));}
  function updateDeliverable(idx,val){setP(x=>({...x,deliverables:x.deliverables.map((d,i)=>i===idx?val:d)}));}
  function removeDeliverable(idx){setP(x=>({...x,deliverables:x.deliverables.filter((_,i)=>i!==idx)}));}

  const {subtotal,tax,total}=calcProposal(p.items,p.taxPct);

  function generateInvoice(){
    const inv={id:uid(),proposalId:p.id,title:'Invoice — '+p.title,clientName:p.clientName,items:p.items.map(i=>({...i})),taxPct:p.taxPct,status:'unpaid',date:new Date().toISOString().slice(0,10),dueDate:new Date(Date.now()+30*864e5).toISOString().slice(0,10),notes:p.notes};
    onUpdate({...store,proposals:store.proposals.map(x=>x.id===id?p:x),invoices:[...store.invoices,inv]});
    navigate('/invoice/'+inv.id);
  }

  function copyClientLink(){
    const data=btoa(JSON.stringify(p));
    const url=window.location.origin+window.location.pathname+'#/view/'+data;
    navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{
      const el=document.createElement('textarea');el.value=url;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();setCopied(true);setTimeout(()=>setCopied(false),2500);
    });
  }

  const fieldStyle={marginBottom:16};

  return(
    <main style={{flex:1,overflowY:'auto',padding:'32px'}} aria-label="Proposal builder">
      <div style={{maxWidth:1100,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
          <button className="btn-ghost" onClick={()=>navigate('/dashboard')} aria-label="Back to dashboard" style={{padding:'8px',display:'flex'}}>
            <Icon.back/>
          </button>
          <h1 style={{fontSize:22,fontWeight:600,margin:0,flex:1,color:'#0F1B2D'}}>{p.title||'Untitled Proposal'}</h1>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <select value="" onChange={e=>loadTemplate(e.target.value)} style={{width:'auto',padding:'8px 12px',fontSize:13}} aria-label="Load template">
              <option value="">Load template…</option>
              <option value="webdev">Web Development</option>
              <option value="branddesign">Brand Design</option>
              <option value="copywriting">Copywriting</option>
              <option value="photography">Photography</option>
            </select>
            <button className="btn-secondary" onClick={copyClientLink} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',fontSize:13}}>
              <Icon.copy/>{copied?'Copied!':'Copy client link'}
            </button>
            <button className="btn-secondary" onClick={generateInvoice} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',fontSize:13}}>
              <Icon.invoice/>Create Invoice
            </button>
            <button className="btn-primary" onClick={()=>save()} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',fontSize:13}}>
              {saved?<><Icon.check/> Saved</>:'Save'}
            </button>
          </div>
        </div>

        {/* Tab switcher */}
        <div style={{display:'flex',gap:0,marginBottom:24,borderBottom:'2px solid #E8ECF0'}} role="tablist">
          {['edit','preview'].map(t=>(
            <button key={t} role="tab" aria-selected={tab===t} onClick={()=>setTab(t)}
              style={{padding:'10px 20px',fontSize:14,fontWeight:600,background:'none',border:'none',cursor:'pointer',color:tab===t?'#0F1B2D':'#566370',borderBottom:tab===t?'2px solid #0F1B2D':'2px solid transparent',marginBottom:'-2px',textTransform:'capitalize'}}>
              {t==='edit'?'Edit':'Preview'}
            </button>
          ))}
        </div>

        {tab==='edit'?(
          <div style={{display:'grid',gridTemplateColumns:'1fr',gap:20}}>
            <div className="card" style={{padding:24}}>
              <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,marginTop:0}}>Cover</h2>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                <div style={fieldStyle}>
                  <label htmlFor="p-title">Proposal Title</label>
                  <input id="p-title" value={p.title} onChange={e=>setP(x=>({...x,title:e.target.value}))} placeholder="e.g. Brand Identity Package"/>
                </div>
                <div style={fieldStyle}>
                  <label htmlFor="p-client">Client Name</label>
                  <input id="p-client" value={p.clientName} onChange={e=>setP(x=>({...x,clientName:e.target.value}))} placeholder="e.g. Acme Corp"/>
                </div>
                <div style={{...fieldStyle,gridColumn:'1/-1'}}>
                  <label htmlFor="p-intro">Introduction</label>
                  <textarea id="p-intro" value={p.intro} onChange={e=>setP(x=>({...x,intro:e.target.value}))} placeholder="Opening paragraph…" style={{minHeight:80}}/>
                </div>
                <div style={{...fieldStyle,gridColumn:'1/-1'}}>
                  <label htmlFor="p-scope">Scope of Work</label>
                  <textarea id="p-scope" value={p.scope} onChange={e=>setP(x=>({...x,scope:e.target.value}))} placeholder="Describe the project scope…"/>
                </div>
              </div>
              <div style={fieldStyle}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <label style={{margin:0}}>Deliverables</label>
                  <button className="btn-ghost" onClick={addDeliverable} style={{padding:'4px 8px',fontSize:12,display:'flex',alignItems:'center',gap:4}}>
                    <Icon.plus/> Add
                  </button>
                </div>
                {p.deliverables.map((d,i)=>(
                  <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                    <input value={d} onChange={e=>updateDeliverable(i,e.target.value)} placeholder={`Deliverable ${i+1}`} aria-label={`Deliverable ${i+1}`}/>
                    <button className="btn-ghost" onClick={()=>removeDeliverable(i)} aria-label={`Remove deliverable ${i+1}`} style={{padding:'8px',flexShrink:0,color:'#991B1B'}}>
                      <Icon.trash/>
                    </button>
                  </div>
                ))}
                {p.deliverables.length===0&&<div style={{fontSize:13,color:'#A9B4BF',fontStyle:'italic'}}>No deliverables added yet.</div>}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                <div style={fieldStyle}>
                  <label htmlFor="p-date">Date</label>
                  <input id="p-date" type="date" value={p.date} onChange={e=>setP(x=>({...x,date:e.target.value}))}/>
                </div>
                <div style={fieldStyle}>
                  <label htmlFor="p-status">Status</label>
                  <select id="p-status" value={p.status} onChange={e=>setP(x=>({...x,status:e.target.value}))}>
                    <option value="draft">Draft</option>
                    <option value="sent">Sent</option>
                    <option value="accepted">Accepted</option>
                    <option value="declined">Declined</option>
                  </select>
                </div>
                <div style={{...fieldStyle,gridColumn:'1/-1'}}>
                  <label htmlFor="p-notes">Notes / Payment Terms</label>
                  <textarea id="p-notes" value={p.notes} onChange={e=>setP(x=>({...x,notes:e.target.value}))} style={{minHeight:64}}/>
                </div>
              </div>
            </div>

            {/* Pricing Table */}
            <div className="card" style={{padding:24}}>
              <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,marginTop:0}}>Pricing</h2>
              <table style={{width:'100%',borderCollapse:'collapse',marginBottom:16}} aria-label="Line items">
                <thead>
                  <tr style={{borderBottom:'1.5px solid #0F1B2D'}}>
                    {['Description','Qty','Rate','Total',''].map(h=>(
                      <th key={h} scope="col" style={{padding:'6px 8px',fontSize:11,fontWeight:600,letterSpacing:'0.06em',color:'#566370',textAlign:h==='Total'||h===''?'right':'left',textTransform:'uppercase'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {p.items.map((item,idx)=>(
                    <tr key={item.id} style={{borderBottom:'1px solid #E8ECF0'}}>
                      <td style={{padding:'8px'}}>
                        <input value={item.description} onChange={e=>updateItem(item.id,'description',e.target.value)} placeholder="Description" aria-label={`Item ${idx+1} description`} style={{fontSize:13}}/>
                      </td>
                      <td style={{padding:'8px',width:70}}>
                        <input type="number" min="0" value={item.qty} onChange={e=>updateItem(item.id,'qty',e.target.value)} aria-label={`Item ${idx+1} quantity`} style={{fontSize:13,textAlign:'right'}}/>
                      </td>
                      <td style={{padding:'8px',width:110}}>
                        <input type="number" min="0" value={item.rate} onChange={e=>updateItem(item.id,'rate',e.target.value)} aria-label={`Item ${idx+1} rate`} style={{fontSize:13,textAlign:'right'}}/>
                      </td>
                      <td style={{padding:'8px',width:110,textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:'#0F1B2D',fontWeight:500}}>
                        {fmt((parseFloat(item.qty)||0)*(parseFloat(item.rate)||0),currency)}
                      </td>
                      <td style={{padding:'8px',width:36,textAlign:'right'}}>
                        <button className="btn-ghost" onClick={()=>removeItem(item.id)} aria-label={`Remove item ${idx+1}`} style={{padding:'4px',color:'#991B1B'}}>
                          <Icon.trash/>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <button className="btn-secondary" onClick={addItem} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',fontSize:13,marginBottom:16}}>
                <Icon.plus/> Add line item
              </button>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
                <div style={{display:'flex',gap:32,fontSize:14}}>
                  <span style={{color:'#566370'}}>Subtotal</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:500}}>{fmt(subtotal,currency)}</span>
                </div>
                <div style={{display:'flex',gap:16,alignItems:'center'}}>
                  <label htmlFor="p-tax" style={{margin:0,fontSize:14,color:'#566370'}}>Tax %</label>
                  <input id="p-tax" type="number" min="0" max="100" value={p.taxPct} onChange={e=>setP(x=>({...x,taxPct:e.target.value}))} style={{width:70,textAlign:'right',padding:'6px 10px'}}/>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:500,fontSize:14}}>{fmt(tax,currency)}</span>
                </div>
                <div style={{background:'#0F1B2D',color:'#fff',padding:'10px 20px',borderRadius:8,display:'flex',gap:32,alignItems:'center',marginTop:4}}>
                  <span style={{fontSize:14,fontWeight:600}}>Total</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:20,fontWeight:500}}>{fmt(total,currency)}</span>
                </div>
              </div>
            </div>
          </div>
        ):(
          <ProposalPreview proposal={p} settings={store.settings}/>
        )}
      </div>
    </main>
  );
}

        {/* Header */}
        <div style={{padding:'80px 80px 0',background:'#fff'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:32}}>
            <div style={{width:40,height:40,borderRadius:'50%',background:'#0F1B2D',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:600,fontSize:14,flexShrink:0}}>{initials}</div>
            <span style={{fontWeight:600,fontSize:16,color:'#0F1B2D'}}>{settings?.businessName||'Your Studio'}</span>

          <h1 style={{fontFamily:'"DM Serif Display",Georgia,serif',fontSize:48,fontWeight:400,color:'#0F1B2D',margin:'0 0 8px',lineHeight:1.1}}>{p.title||'Proposal'}</h1>
          {p.clientName&&<div style={{fontSize:15,color:'#566370',marginBottom:32}}>Prepared for {p.clientName}</div>}
          <hr style={{border:'none',borderTop:'1px solid #E8ECF0',margin:'0 0 32px'}}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:32}}>
            <div>
              <div style={{fontSize:12,fontWeight:600,color:'#7C8A96',letterSpacing:'0.04em',textTransform:'uppercase',marginBottom:4}}>Prepared by</div>
              <div style={{fontSize:15,color:'#0F1B2D'}}>{settings?.businessName||'Your Studio'}</div>

// ── CLIENT VIEW (read-only, no sidebar) ──────────────────────────────────────
function ClientView({data}){
  let proposal=null;
  try{proposal=JSON.parse(atob(data));}catch(e){
    return(
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F4F6F8'}}>
        <div style={{textAlign:'center'}}>
          <h1 style={{fontSize:22,color:'#991B1B'}}>Invalid proposal link</h1>
          <p style={{color:'#566370'}}>This link may be corrupted or expired.</p>
        </div>
      </div>
    );
  }
  return <ProposalPreview proposal={proposal} settings={{businessName:proposal.businessName||''}} readOnly={true}/>;
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function Settings({store,onUpdate}){
  const [s,setS]=useState({...DEFAULT_SETTINGS,...store.settings});
  const [saved,setSaved]=useState(false);
  const fileRef=useRef(null);

  function save(){
    onUpdate({...store,settings:s});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='propkit-workspace.json';a.click();URL.revokeObjectURL(url);
  }

  function importData(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.proposals&&data.invoices&&data.settings){
          onUpdate(data);alert('Workspace imported successfully.');
        }else{alert('Invalid workspace file.');}
      }catch{alert('Could not parse file.');}
    };
    reader.readAsText(file);
  }

  return(
    <main style={{flex:1,padding:32,overflowY:'auto'}} aria-label="Settings">
      <div style={{maxWidth:600,margin:'0 auto'}}>
        <h1 style={{fontSize:28,fontWeight:600,marginBottom:24,color:'#0F1B2D'}}>Settings</h1>
        <div className="card" style={{padding:24,marginBottom:24}}>
          <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,marginTop:0}}>Business</h2>
          <div style={{marginBottom:16}}>
            <label htmlFor="s-name">Business Name</label>
            <input id="s-name" value={s.businessName} onChange={e=>setS(x=>({...x,businessName:e.target.value}))} placeholder="Your Studio"/>
          </div>
          <div style={{marginBottom:16}}>
            <label htmlFor="s-currency">Currency</label>
            <select id="s-currency" value={s.currency} onChange={e=>setS(x=>({...x,currency:e.target.value}))}>
              <option value="USD">USD — US Dollar</option>
              <option value="EUR">EUR — Euro</option>
              <option value="GBP">GBP — British Pound</option>
              <option value="CAD">CAD — Canadian Dollar</option>
              <option value="AUD">AUD — Australian Dollar</option>
              <option value="SAR">SAR — Saudi Riyal</option>
              <option value="AED">AED — UAE Dirham</option>
            </select>
          </div>
          <button className="btn-primary" onClick={save}>{saved?<><Icon.check/> Saved</>:'Save settings'}</button>
        </div>
        <div className="card" style={{padding:24}}>
          <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,marginTop:0}}>Workspace</h2>
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            <button className="btn-secondary" onClick={exportData} style={{display:'flex',alignItems:'center',gap:6}}>
              <Icon.download/> Export JSON
            </button>
            <button className="btn-secondary" onClick={()=>fileRef.current.click()} style={{display:'flex',alignItems:'center',gap:6}}>
              <Icon.upload/> Import JSON
            </button>
          </div>
          <input ref={fileRef} type="file" accept=".json" onChange={importData} style={{display:'none'}} aria-label="Import workspace file"/>
          <p style={{fontSize:13,color:'#566370',marginTop:12,marginBottom:0}}>Export backs up all proposals, invoices, and settings. Import restores from a previously exported file.</p>
        </div>
      </div>
    </main>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const [store,setStore]=useState(()=>{
    const raw=loadStore();
    return raw||seedStore();
  });
  const [route,setRoute]=useState(getRoute);

  useEffect(()=>{
    saveStore(store);
  },[store]);

  useEffect(()=>{
    function onHash(){setRoute(getRoute());}
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[]);

  if(route.view==='client'){
    return <ClientView data={route.data}/>;
  }

  const mainContent=()=>{
    switch(route.view){
      case 'proposal':return <ProposalBuilder id={route.id} store={store} onUpdate={setStore}/>;
      case 'invoice':return <InvoiceView id={route.id} store={store} onUpdate={setStore}/>;
      case 'settings':return <Settings store={store} onUpdate={setStore}/>;
      default:return <Dashboard store={store} onUpdate={setStore}/>;
    }
  };

  return(
    <div style={{display:'flex',minHeight:'100vh'}}>
      <Sidebar route={route} settings={store.settings}/>
      {mainContent()}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
